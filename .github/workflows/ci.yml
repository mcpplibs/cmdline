name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  XLINGS_NON_INTERACTIVE: '1'

jobs:
  build:
    name: build + test (linux x86_64, mcpp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xlings
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh | bash -s v2026.10.26.1
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Install mcpp (the version .xlings.json names)
        run: |
          MCPP_VERSION="$(sed -n 's/.*"mcpp": *"\([^"]*\)".*/\1/p' .xlings.json)"
          for attempt in 1 2 3; do
            xlings update > /dev/null 2>&1 || true
            if xlings install "mcpp@$MCPP_VERSION" -y -g; then break; fi
            [ "$attempt" = 3 ] && { echo "::error::mcpp could not be installed"; exit 1; }
            sleep 30
          done

      # Cache mcpp's self-bootstrapped sandbox (toolchain, binutils, ninja,
      # patchelf). The toolchain set is pinned by the mcpp in .xlings.json,
      # so its version keys the cache.
      - name: Cache mcpp sandbox
        uses: actions/cache@v4
        with:
          path: ~/.xlings/data/xpkgs/xim-x-mcpp/2026.11.8.1/registry
          key: mcpp-sandbox-${{ runner.os }}-mcpp2026.11.8.1

      - name: Build with mcpp
        run: mcpp build

      - name: Run tests
        run: mcpp test
