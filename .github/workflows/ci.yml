name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build + test (linux x86_64, mcpp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xlings
        env:
          XLINGS_VERSION: 0.4.30
        run: |
          tarball="xlings-${XLINGS_VERSION}-linux-x86_64.tar.gz"
          curl -fsSL -o "/tmp/${tarball}" \
            "https://github.com/d2learn/xlings/releases/download/v${XLINGS_VERSION}/${tarball}"
          tar -xzf "/tmp/${tarball}" -C /tmp
          "/tmp/xlings-${XLINGS_VERSION}-linux-x86_64/subos/default/bin/xlings" self install
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Install workspace tools (.xlings.json → mcpp)
        run: xlings install -y

      # Cache mcpp's self-bootstrapped sandbox (toolchain, binutils, ninja,
      # patchelf). The toolchain set is pinned by the mcpp in .xlings.json,
      # so its version keys the cache.
      - name: Cache mcpp sandbox
        uses: actions/cache@v4
        with:
          path: ~/.xlings/data/xpkgs/xim-x-mcpp/2026.11.8.1/registry
          key: mcpp-sandbox-${{ runner.os }}-mcpp2026.11.8.1

      - name: Build with mcpp
        run: mcpp build

      - name: Run tests
        run: mcpp test
